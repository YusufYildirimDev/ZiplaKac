<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zıpla Kaç</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg-top: #1e2a4a;
    --bg-bottom: #0d1220;
    --ground: #2b3a63;
    --player: #ffd166;
    --player-glow: #ffe8a8;
    --obstacle: #ef476f;
    --obstacle-air: #ef476f;
    --accent: #06d6a0;
    --text: #f4f6fb;
    --card-bg: rgba(20, 26, 48, 0.85);
    --card-border: rgba(255,255,255,0.12);
    --shield: #4cc9f0;
    --slow: #90e0ef;
    --multi: #ffd60a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-top: #aee7ff;
      --bg-bottom: #e9f7ff;
      --ground: #5a8fd6;
      --text: #10213a;
      --card-bg: rgba(255,255,255,0.88);
      --card-border: rgba(0,0,0,0.08);
    }
  }
  :root[data-theme="dark"] {
    --bg-top: #1e2a4a;
    --bg-bottom: #0d1220;
    --ground: #2b3a63;
    --text: #f4f6fb;
    --card-bg: rgba(20, 26, 48, 0.85);
    --card-border: rgba(255,255,255,0.12);
  }
  html, body {
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
    background: var(--bg-bottom);
  }
  * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100%;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
    color: var(--text);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.5px;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  #statusRow {
    position: absolute;
    top: calc(44px + env(safe-area-inset-top, 0px));
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 8px;
    pointer-events: none;
  }
  .badge {
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    letter-spacing: 0.3px;
    text-shadow: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5,8,18,0.55);
    backdrop-filter: blur(2px);
  }
  #overlay.hidden { display: none; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 28px 26px;
    text-align: center;
    color: var(--text);
    width: 82%;
    max-width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .card h1 {
    margin: 0 0 6px;
    font-size: 26px;
  }
  .card p {
    margin: 6px 0 18px;
    opacity: 0.8;
    font-size: 14px;
    line-height: 1.5;
  }
  .big-score {
    font-size: 42px;
    font-weight: 800;
    color: var(--accent);
    margin: 4px 0 2px;
  }
  .best {
    font-size: 13px;
    opacity: 0.7;
    margin-bottom: 6px;
  }
  .history {
    font-size: 12px;
    opacity: 0.6;
    margin-bottom: 18px;
  }
  button#startBtn, button#retryBtn {
    background: var(--accent);
    color: #0a1a14;
    border: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(6,214,160,0.35);
  }
  button#startBtn:active, button#retryBtn:active {
    transform: scale(0.97);
  }
  #hint {
    position: absolute;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    left: 0;
    right: 0;
    text-align: center;
    color: var(--text);
    opacity: 0.55;
    font-size: 13px;
    pointer-events: none;
  }
  .char-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    opacity: 0.7;
    margin: 2px 0 8px;
  }
  .char-grid {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 0 0 18px;
    flex-wrap: wrap;
  }
  .char-option {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .char-swatch {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 3px solid transparent;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    transition: transform .15s, border-color .15s;
  }
  .char-option.selected .char-swatch {
    border-color: var(--accent);
    transform: scale(1.08);
  }
  .char-option span {
    font-size: 10px;
    color: var(--text);
    opacity: 0.75;
    font-weight: 600;
  }
  #powerupCountdown {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.3s;
  }
  #powerupCountdown.hidden { opacity: 0; }
  #powerupCountdown .pcd-ring {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 4px solid currentColor;
    box-shadow: 0 0 24px currentColor, inset 0 0 14px rgba(0,0,0,0.4);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    gap: 2px;
  }
  #powerupCountdown .pcd-icon {
    font-size: 26px;
    line-height: 1;
    filter: drop-shadow(0 0 6px currentColor);
  }
  #powerupCountdown .pcd-num {
    font-size: 36px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1px;
    text-shadow: 0 0 12px currentColor;
  }
  #powerupCountdown .pcd-label {
    font-size: 11px;
    font-weight: 700;
    opacity: 0.9;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  @keyframes pcd-pulse {
    0%   { transform: translate(-50%,-50%) scale(1.00); }
    50%  { transform: translate(-50%,-50%) scale(1.07); }
    100% { transform: translate(-50%,-50%) scale(1.00); }
  }
  #powerupCountdown.active {
    animation: pcd-pulse 1s ease-in-out infinite;
  }
  button.wardrobe-btn {
    background: #9b5de5;
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(155,93,229,0.35);
    margin-top: 10px;
    width: 100%;
  }
  button.wardrobe-btn:active {
    transform: scale(0.97);
  }
  .wardrobe-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.07);
    padding: 10px 14px;
    border-radius: 12px;
    gap: 12px;
  }
  .wardrobe-row img {
    width: 52px;
    height: 52px;
    object-fit: contain;
  }
  .wardrobe-info {
    flex: 1;
    text-align: left;
  }
  .wardrobe-name {
    font-size: 15px;
    font-weight: 700;
  }
  .wardrobe-price {
    font-size: 13px;
    color: #ffd166;
  }
  .wardrobe-action-btn {
    border: none;
    padding: 9px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="scoreLabel">Skor: 0</div>
    <div id="goldLabel" style="color:#ffd166;font-weight:700;">🪙 0</div>
    <div id="bestLabel">En iyi: 0</div>
  </div>
  <div id="statusRow"></div>
  <div id="hint">Dokun: zıpla · havadayken tekrar dokun: çift zıpla</div>

  <!-- Merkez Güçlendirme Geri Sayaç -->
  <div id="powerupCountdown" class="hidden">
    <div class="pcd-ring">
      <div class="pcd-icon" id="pcdIcon">⚡</div>
      <div class="pcd-num" id="pcdNum">0</div>
      <div class="pcd-label" id="pcdLabel">SN</div>
    </div>
  </div>

  <div id="overlay">
    <div class="card">
      <h1>Zıpla Kaç</h1>
      <p>Engellerden zıpla, havada tekrar dokunarak çift zıpla! Kalkan/yavaşlatma/x2 puan güçlendirmelerini topla.</p>
      <div class="char-label">Karakterini seç</div>
      <div class="char-grid" id="charGrid"></div>
      <button id="startBtn">Başla</button>
      <button id="wardrobeBtn" class="wardrobe-btn">🛒 Mağaza & Gardırop</button>
    </div>
  </div>

  <!-- Mağaza & Gardırop Modalı -->
  <div id="wardrobeModal" class="hidden" style="position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:30;">
    <div class="card" style="max-width:440px;width:92%;padding:22px;">
      <h1 id="shopModalTitle" style="color:#9b5de5;font-size:24px;margin-bottom:4px;">🛒 Mağaza & Yükseltmeler</h1>
      <div id="wardrobeTotalGold" style="color:#ffd166;font-size:18px;font-weight:700;margin-bottom:8px;">🪙 Toplam Altın: 150</div>
      <div style="display:flex;gap:10px;margin-bottom:12px;">
        <button id="shopTabUpgradesBtn" style="flex:1;padding:12px;border:none;border-radius:10px;background:#9b5de5;color:#fff;font-weight:700;font-size:15px;cursor:pointer;">⚡ Güçler</button>
        <button id="shopTabOutfitsBtn" style="flex:1;padding:12px;border:none;border-radius:10px;background:#24283b;color:#a0aec0;font-weight:700;font-size:15px;cursor:pointer;">👔 Gardırop</button>
      </div>
      <div id="wardrobeStatusMsg" style="font-size:13px;min-height:20px;margin-bottom:8px;"></div>
      <div id="wardrobeItemsList" style="display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;margin-bottom:14px;"></div>
      <button id="closeWardrobeBtn" style="background:#3a4060;color:#fff;border:none;padding:12px 24px;border-radius:999px;font-weight:700;font-size:16px;cursor:pointer;width:100%;">Kapat</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var wrap = document.getElementById("wrap");
  var overlay = document.getElementById("overlay");
  var scoreLabel = document.getElementById("scoreLabel");
  var goldLabel = document.getElementById("goldLabel");
  var bestLabel = document.getElementById("bestLabel");
  var statusRow = document.getElementById("statusRow");

  var pcdEl = document.getElementById("powerupCountdown");
  var pcdIcon = document.getElementById("pcdIcon");
  var pcdNum = document.getElementById("pcdNum");
  var pcdLabel = document.getElementById("pcdLabel");

  var wardrobeModal = document.getElementById("wardrobeModal");
  var wardrobeBtn = document.getElementById("wardrobeBtn");
  var closeWardrobeBtn = document.getElementById("closeWardrobeBtn");

  var DPR = Math.max(1, window.devicePixelRatio || 1);
  var W = 0, H = 0;
  var groundY = 0, groundHeight = 64;

  function resize() {
    var rect = wrap.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    groundHeight = Math.round(H * 0.18);
    groundY = H - groundHeight;
    if (player && player.onGround) {
      player.y = groundY - player.h;
    }
  }
  window.addEventListener("resize", resize);

  // ---- persistent best score + history (per-viewer, safe) ----
  var BEST_KEY = "zipla-kac-best";
  var HISTORY_KEY = "zipla-kac-history";
  var best = 0;
  var history = [];
  try {
    var saved = window.localStorage.getItem(BEST_KEY);
    if (saved) best = parseInt(saved, 10) || 0;
    var savedHist = window.localStorage.getItem(HISTORY_KEY);
    if (savedHist) {
      var parsed = JSON.parse(savedHist);
      if (Array.isArray(parsed)) history = parsed.slice(0, 5);
    }
  } catch (e) { /* storage unavailable, ignore */ }

  function saveBest() {
    try { window.localStorage.setItem(BEST_KEY, String(best)); }
    catch (e) { /* ignore */ }
  }
  function saveHistory(s) {
    history.unshift(Math.floor(s));
    history = history.slice(0, 5);
    try { window.localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
    catch (e) { /* ignore */ }
  }

  // ---- character selection ----
  var CHARACTERS = [
    { id: "classic", name: "Klasik", body: "#ffd166", glow: "#ffe8a8" },
    { id: "fire", name: "Ateş", body: "#ff6b35", glow: "#ffb199" },
    { id: "ice", name: "Buz", body: "#4cc9f0", glow: "#bde0fe" },
    { id: "toxic", name: "Zehir", body: "#7cf29c", glow: "#c8ffd8" },
    { id: "shadow", name: "Gece", body: "#9b5de5", glow: "#d8b4fe" }
  ];
  var CHAR_KEY = "zipla-kac-char";
  var selectedCharId = "classic";
  try {
    var savedChar = window.localStorage.getItem(CHAR_KEY);
    if (savedChar && CHARACTERS.some(function (c) { return c.id === savedChar; })) {
      selectedCharId = savedChar;
    }
  } catch (e) { /* ignore */ }

  function getCharacter() {
    for (var i = 0; i < CHARACTERS.length; i++) {
      if (CHARACTERS[i].id === selectedCharId) return CHARACTERS[i];
    }
    return CHARACTERS[0];
  }

  function buildCharGrid() {
    var grid = document.getElementById("charGrid");
    if (!grid) return;
    grid.innerHTML = CHARACTERS.map(function (c) {
      var sel = c.id === selectedCharId ? " selected" : "";
      return (
        '<div class="char-option' + sel + '" data-char="' + c.id + '">' +
        '<div class="char-swatch" style="background:' + c.body + ';"></div>' +
        "<span>" + c.name + "</span></div>"
      );
    }).join("");
    var opts = grid.querySelectorAll(".char-option");
    for (var i = 0; i < opts.length; i++) {
      opts[i].addEventListener("click", function (e) {
        e.stopPropagation();
        selectedCharId = this.getAttribute("data-char");
        try { window.localStorage.setItem(CHAR_KEY, selectedCharId); } catch (err) { /* ignore */ }
        buildCharGrid();
        renderWardrobeModal();
      });
    }
  }

  // ---- Gold, Shop & Wardrobe System ----
  var GOLD_KEY = "zipla-kac-gold";
  var OUTFITS_PURCHASED_KEY = "zipla-kac-outfits-bought";
  var OUTFITS_EQUIPPED_KEY = "zipla-kac-outfits-equipped";
  var CONSUMABLES_KEY = "zipla-kac-consumables";
  var UPGRADES_KEY = "zipla-kac-upgrades";

  var runGold = 0;
  var runScoreGold = 0;
  var runComboGold = 0;
  var runRecordGold = 0;
  var currentShopTab = "upgrades";

  var WARDROBE_ITEMS = [
    { type: "pelerin",        name: "Pelerin",         price: 80 },
    { type: "gunes_gozlugu",  name: "Güneş Gözlüğü",   price: 80 },
    { type: "parti_sapkasi",  name: "Parti Şapkası",   price: 80 },
    { type: "ozel_aksesuar",  name: "Özel Aksesuar",   price: 120 }
  ];

  var CONSUMABLE_ITEMS = [
    { id: "shield",        name: "Başlangıç Kalkanı",    desc: "Oyuna 1 kalkanla başla", price: 30 },
    { id: "slow_start",    name: "Yavaş Başlangıç",      desc: "İlk 5sn engel hızı %30 yavaş", price: 20 },
    { id: "lucky_pu",      name: "Şanslı Güçlendirme",   desc: "İlk küre 3. saniyede çıkar", price: 15 },
    { id: "second_chance", name: "İkinci Şans Bileti",   desc: "Çarpışınca 1 kez ücretsiz devam et", price: 40 }
  ];

  var UPGRADE_ITEMS = [
    { id: "pu_duration",   name: "Güçlendirme Süresi",   desc: "Kalkan/yavaş/x2 süreleri +%20 uzar", price: 150, maxLevel: 3 },
    { id: "double_jump",   name: "Çift Zıplama Ustası",  desc: "2. zıplama yüksekliği +%15 artar",  price: 200, maxLevel: 1 },
    { id: "combo_memory",  name: "Kombo Hafızası",       desc: "Çarpışmada kombonun yarısı korunur", price: 250, maxLevel: 1 },
    { id: "signature",     name: "İmza Yeteneği +1",     desc: "Karakterin özel yeteneği güçlenir",  price: 300, maxLevel: 1 }
  ];

  function getTotalGold() {
    try {
      var val = window.localStorage.getItem(GOLD_KEY);
      return val !== null ? parseInt(val, 10) : 150;
    } catch (e) { return 150; }
  }
  function addGold(n) {
    var cur = getTotalGold() + n;
    try { window.localStorage.setItem(GOLD_KEY, String(cur)); } catch (e) {}
    return cur;
  }
  function spendGold(n) {
    var cur = getTotalGold();
    if (cur < n) return false;
    try { window.localStorage.setItem(GOLD_KEY, String(cur - n)); } catch (e) {}
    return true;
  }

  // Consumables Storage
  function getConsumables() {
    try { return JSON.parse(window.localStorage.getItem(CONSUMABLES_KEY) || "{}"); } catch (e) { return {}; }
  }
  function getConsumableCount(id) {
    var c = getConsumables();
    return c[id] || 0;
  }
  function addConsumable(id, count) {
    var c = getConsumables();
    c[id] = (c[id] || 0) + (count || 1);
    try { window.localStorage.setItem(CONSUMABLES_KEY, JSON.stringify(c)); } catch (e) {}
  }
  function useConsumable(id) {
    var c = getConsumables();
    if (c[id] && c[id] > 0) {
      c[id]--;
      try { window.localStorage.setItem(CONSUMABLES_KEY, JSON.stringify(c)); } catch (e) {}
      return true;
    }
    return false;
  }

  // Upgrades Storage
  function getUpgrades() {
    try { return JSON.parse(window.localStorage.getItem(UPGRADES_KEY) || "{}"); } catch (e) { return {}; }
  }
  function getUpgradeLevel(charKey, id) {
    var u = getUpgrades();
    return (u[charKey] && u[charKey][id]) || 0;
  }
  function purchaseUpgrade(charKey, id, price, maxLevel) {
    var curLvl = getUpgradeLevel(charKey, id);
    if (curLvl >= maxLevel) return false;
    if (!spendGold(price)) return false;
    var u = getUpgrades();
    if (!u[charKey]) u[charKey] = {};
    u[charKey][id] = curLvl + 1;
    try { window.localStorage.setItem(UPGRADES_KEY, JSON.stringify(u)); } catch (e) {}
    return true;
  }

  // Outfits Storage
  function getPurchasedOutfits() {
    try { return JSON.parse(window.localStorage.getItem(OUTFITS_PURCHASED_KEY) || "{}"); } catch (e) { return {}; }
  }
  function getEquippedOutfits() {
    try { return JSON.parse(window.localStorage.getItem(OUTFITS_EQUIPPED_KEY) || "{}"); } catch (e) { return {}; }
  }
  function isOutfitPurchased(charKey, type) {
    var p = getPurchasedOutfits();
    return !!(p[charKey] && p[charKey][type]);
  }
  function isOutfitEquipped(charKey, type) {
    if (!isOutfitPurchased(charKey, type)) return false;
    var eq = getEquippedOutfits();
    return !!(eq[charKey] && eq[charKey][type]);
  }
  function purchaseOutfit(charKey, type, price) {
    if (isOutfitPurchased(charKey, type)) return true;
    if (!spendGold(price)) return false;
    var p = getPurchasedOutfits();
    if (!p[charKey]) p[charKey] = {};
    p[charKey][type] = true;
    try { window.localStorage.setItem(OUTFITS_PURCHASED_KEY, JSON.stringify(p)); } catch (e) {}
    setOutfitEquipped(charKey, type, true);
    return true;
  }
  function setOutfitEquipped(charKey, type, equip) {
    var eq = getEquippedOutfits();
    if (!eq[charKey]) eq[charKey] = {};
    eq[charKey][type] = !!equip;
    try { window.localStorage.setItem(OUTFITS_EQUIPPED_KEY, JSON.stringify(eq)); } catch (e) {}
  }
  function toggleOutfitEquip(charKey, type) {
    var cur = isOutfitEquipped(charKey, type);
    setOutfitEquipped(charKey, type, !cur);
    return !cur;
  }

  function renderWardrobeModal() {
    var world = WORLDS[selectedCharId] || WORLDS.classic;
    var charKey = world.key;
    var totalGoldEl = document.getElementById("wardrobeTotalGold");
    var listEl = document.getElementById("wardrobeItemsList");
    var msgEl = document.getElementById("wardrobeStatusMsg");
    var titleEl = document.getElementById("shopModalTitle");
    var tabUpBtn = document.getElementById("shopTabUpgradesBtn");
    var tabOutBtn = document.getElementById("shopTabOutfitsBtn");

    if (totalGoldEl) totalGoldEl.textContent = "🪙 Toplam Altın: " + getTotalGold();
    if (msgEl) msgEl.textContent = "";

    if (tabUpBtn && tabOutBtn) {
      if (currentShopTab === "upgrades") {
        tabUpBtn.style.background = "#9b5de5";
        tabUpBtn.style.color = "#fff";
        tabOutBtn.style.background = "#24283b";
        tabOutBtn.style.color = "#a0aec0";
        if (titleEl) titleEl.textContent = "⚡ Güçler & Yükseltmeler";
      } else {
        tabOutBtn.style.background = "#9b5de5";
        tabOutBtn.style.color = "#fff";
        tabUpBtn.style.background = "#24283b";

  var audioCtx = null;
  function ensureAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function beep(freq, dur, type, vol, freqTo) {
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (freqTo) osc.frequency.linearRampToValueAtTime(freqTo, audioCtx.currentTime + dur);
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(vol || 0.2, audioCtx.currentTime + 0.01);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur + 0.02);
    } catch (e) { /* ignore */ }
  }
  function arpeggio(freqs, dur) {
    for (var i = 0; i < freqs.length; i++) {
      (function (f, idx) {
        setTimeout(function () { beep(f, dur, "triangle", 0.16); }, idx * 85);
      })(freqs[i], i);
    }
  }

  function weightedPick(weights) {
    var total = 0, k;
    for (k in weights) total += weights[k];
    var r = Math.random() * total;
    for (k in weights) {
      if (r < weights[k]) return k;
      r -= weights[k];
    }
    return Object.keys(weights)[0];
  }

  var TIER_WEIGHTS = [
    { cactus: 60, rock: 25, spiketall: 15 },

  ];

  function spawnObstacle() {
    var tier = getTier(score);
    var kind = weightedPick(TIER_WEIGHTS[tier]);
    var w, h, y;
    if (kind === "cactus") {
      w = 18 + Math.random() * 10; h = 30 + Math.random() * 16; y = groundY - h;
    } else if (kind === "rock") {
      w = 30 + Math.random() * 16; h = 22 + Math.random() * 12; y = groundY - h;
    } else if (kind === "spiketall") {
      w = 16 + Math.random() * 8; h = 55 + Math.random() * 23; y = groundY - h;
    } else if (kind === "birdlow") {
      w = 52; h = 30; y = groundY - 76;

    obstacles.push({ x: W + 20, y: y, w: w, h: h, kind: kind, phase: Math.random() * 10 });

  }

  }

    var finalScoreInt = Math.floor(score);
    wasNewBest = finalScoreInt > best;
    if (wasNewBest) {
      best = finalScoreInt;
      saveBest();
      runRecordGold = 50;
    } else {
      runRecordGold = 0;
    }

    runScoreGold = Math.floor(finalScoreInt * 0.10);
    runGold = runObstacleGold + runComboGold + runScoreGold + runRecordGold;

    saveHistory(finalScoreInt);
    addGold(runGold);
    updateHud();
    vibrate(120);
    if (wasNewBest) {
      arpeggio([523, 659, 784, 1046], 0.12);
    } else {
      beep(260, 0.3, "sawtooth", 0.2, 110);
    }
    showOverlay();
  }

  function showOverlay() {
    overlay.innerHTML = buildOverlayHtml();
    overlay.classList.remove("hidden");
    var btn = document.getElementById("retryBtn") || document.getElementById("startBtn");
    if (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        resetGame();
      });
    }
  }

  function buildOverlayHtml() {
    var histLine = history.length ? "Son skorlar: " + history.join(", ") : "";
    var newBestLine = wasNewBest ? '<div style="color:var(--multi);font-weight:700;font-size:13px;margin-bottom:4px;">Yeni rekor! (+50 🪙 Rekor Bonusu)</div>' : "";
    var goldDetail = '<div style="color:#ffd166;font-size:14px;font-weight:700;margin:6px 0 2px;">+' + runGold + ' 🪙 Kazandın</div>' +
      '<div style="color:#a0aec0;font-size:11px;margin-bottom:10px;">(Skor: +' + runScoreGold + ', Kombo: +' + runComboGold + (runRecordGold > 0 ? (', Rekor: +' + runRecordGold) : '') + ') · Kasa: ' + getTotalGold() + ' 🪙</div>';

    return (
      '<div class="card">' +
      "<h1>Oyun Bitti</h1>" +
      newBestLine +
      '<div class="big-score">' + Math.floor(score) + "</div>" +
      '<div class="best">En iyi skor: ' + Math.floor(best) + "</div>" +
      goldDetail +
      '<div class="history">' + histLine + "</div>" +
      '<button id="retryBtn">Tekrar Oyna</button>' +
      "</div>"
    );
  }

  // ---- input ----
  function onPress(e) {
    e.preventDefault();
    jump();
  }
  wrap.addEventListener("pointerdown", onPress, { passive: false });
  overlay.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      jump();
    }
  });

  // ---- loop ----
  function loop(ts) {
    if (!tLast) tLast = ts;
    var dt = Math.min(0.033, (ts - tLast) / 1000);
    tLast = ts;

    var targetTier = getTier(score);
    if (targetTier !== bgTransition.toTier) {
      bgTransition.fromTier = (bgTransition.progress < 1.0) ? bgTransition.toTier : bgTransition.fromTier;
      bgTransition.toTier = targetTier;
      bgTransition.progress = 0;
    }
    if (bgTransition.progress < 1.0) {
      bgTransition.progress = Math.min(1.0, bgTransition.progress + dt / bgTransition.duration);
    }

    ctx.clearRect(0, 0, W, H);
    drawBackground();

    if (state === "running") {
      step(dt);
    }
    drawGround();
    drawPowerups();
    drawObstacles();
    drawPlayer();
    drawParticles(dt);
    drawComboPopup();

    requestAnimationFrame(loop);
  }

  function step(dt) {
    gameTime += dt;
    var world = WORLDS[selectedCharId] || WORLDS.classic;
    var charKey = world.key;
    var hasSignature = getUpgradeLevel(charKey, "signature") > 0;
    var signatureScoreBonus = (charKey === "klasik" && hasSignature) ? 1.15 : 1.0;

    var slowActive = effects.slowUntil > gameTime;
    var multiActive = effects.multiUntil > gameTime;
    var effSpeed = speed * (slowActive ? 0.5 : 1);

    speed += dt * 14;
    score += dt * 22 * (multiActive ? 2 : 1) * signatureScoreBonus;
    groundScrollX += effSpeed * dt;
    updateHud();

    // physics
    player.vy += gravity * dt;
    player.y += player.vy * dt;
    var floorY = groundY - player.h;
    if (player.y >= floorY) {
      player.y = floorY;
      player.vy = 0;
      if (!player.onGround) {
        player.onGround = true;
        player.jumpsUsed = 0;
        for (var i = 0; i < 6; i++) {
          particles.push({
            x: player.x + player.w / 2,
            y: groundY,
            vx: (Math.random() - 0.5) * 120,
            vy: -Math.random() * 80,
            life: 0.4,
            color: null
          });
        }
      }
    }
    if (player.squash > 0) player.squash -= dt * 4;

    if (comboPopupTimer > 0) comboPopupTimer -= dt;

    // spawn obstacles
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = Math.max(0.5, 1.4 - speed / (W * 1.6));
    }

    // spawn powerups
    powerupTimer -= dt;
    if (powerupTimer <= 0 && powerups.length < 1) {
      spawnPowerup();
      powerupTimer = 8 + Math.random() * 6;
    }

    var pBox = { x: player.x + 5, y: player.y + 5, w: player.w - 10, h: player.h - 10 };

    // move + collide obstacles
    for (var j = obstacles.length - 1; j >= 0; j--) {
      var o = obstacles[j];
      o.x -= effSpeed * dt;
      if (o.x + o.w < -10) {
        obstacles.splice(j, 1);
        consecutivePassedObstacles++;
        var addG = multiActive ? 2 : 1;
        runObstacleGold += addG;

        // Kombo serisi eşik ödülleri
        var comboGoldBonus = 0;
        if (consecutivePassedObstacles === 5) comboGoldBonus = 2;
        else if (consecutivePassedObstacles === 10) comboGoldBonus = 5;
        else if (consecutivePassedObstacles === 20) comboGoldBonus = 12;
        else if (consecutivePassedObstacles === 40) comboGoldBonus = 30;
        else if (consecutivePassedObstacles > 40 && consecutivePassedObstacles % 10 === 0) comboGoldBonus = 10;

        // Zehir Karakteri İmza Yeteneği: Kombo ödülleri x1.25 katına çıkar
        if (charKey === "zehir" && hasSignature && comboGoldBonus > 0) {
          comboGoldBonus = Math.round(comboGoldBonus * 1.25);
        }

        if (comboGoldBonus > 0) {
          runComboGold += comboGoldBonus;
        }
        runGold = runObstacleGold + runComboGold;

        if (consecutivePassedObstacles % 5 === 0) {
          comboCount++;
          score += 10;
          comboPopupText = "Kombo x" + comboCount + "! +10";
          comboPopupTimer = 1.2;
          arpeggio([660, 880], 0.08);
        }
        continue;
      }
      if (gameTime < ignoreCollisionUntil) continue;
      if (rectsOverlap(pBox, o)) {
        var hasComboMemory = getUpgradeLevel(charKey, "combo_memory") > 0;

        if (player.shielded) {
          player.shielded = false;
          ignoreCollisionUntil = gameTime + 0.8;
          obstacles.splice(j, 1);
          if (hasComboMemory) {
            comboCount = Math.floor(comboCount / 2);
            consecutivePassedObstacles = comboCount * 5;
          } else {
            comboCount = 0;
            consecutivePassedObstacles = 0;
          }
          beep(200, 0.15, "square", 0.25);
          vibrate(80);
          continue;
        }

        // İkinci Şans Bileti
        if (hasSecondChance && useConsumable("second_chance")) {
          hasSecondChance = false;
          ignoreCollisionUntil = gameTime + 1.6;
          obstacles = [];
          if (hasComboMemory) {
            comboCount = Math.floor(comboCount / 2);
            consecutivePassedObstacles = comboCount * 5;
          } else {
            comboCount = 0;
            consecutivePassedObstacles = 0;
          }
          arpeggio([523, 659, 784, 1046], 0.1);
          vibrate(100);
          return;
        }

        // Gece Karakteri İmza Yeteneği: %28 Otomatik Sıyrılma Şansı
        if (charKey === "gece" && hasSignature && Math.random() < 0.28) {
          ignoreCollisionUntil = gameTime + 1.6;
          obstacles = [];
          if (hasComboMemory) {
            comboCount = Math.floor(comboCount / 2);
            consecutivePassedObstacles = comboCount * 5;
          } else {
            comboCount = 0;
            consecutivePassedObstacles = 0;
          }
          arpeggio([523, 659, 784, 1046], 0.1);
          vibrate(100);
          return;
        }

        gameOver();
        return;
      }
    }

    // move + collect powerups
    for (var k = powerups.length - 1; k >= 0; k--) {
      var pu = powerups[k];
      pu.x -= effSpeed * dt;
      if (pu.x + pu.r * 2 < -10) { powerups.splice(k, 1); continue; }
      var puBox = { x: pu.x - pu.r, y: pu.y - pu.r, w: pu.r * 2, h: pu.r * 2 };
      if (rectsOverlap(pBox, puBox)) {
        applyPowerup(pu.kind);
        powerups.splice(k, 1);
      }
    }
  }

  var TIER_BG = [
    null, // tier 0 uses CSS vars (theme-aware)
    { top: "#ffb86b", bottom: "#ff7e5f", ground: "#8a4a2d" },
    { top: "#6b5b95", bottom: "#2d2350", ground: "#3a2a55" },
    { top: "#0b0f2a", bottom: "#000000", ground: "#141430" }
  ];

  function renderSingleBackground(t) {
    var world = WORLDS[selectedCharId] || WORLDS.classic;
    var wImgs = worldImages[selectedCharId] || worldImages.classic;
    var img = wImgs && wImgs.bgs ? wImgs.bgs[t] : null;
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, 0, 0, W, H);
      return;
    }
    var g = ctx.createLinearGradient(0, 0, 0, H);
    if (t === 0) {
      g.addColorStop(0, getVar("--bg-top"));
      g.addColorStop(1, getVar("--bg-bottom"));
    } else {
      var c = TIER_BG[t] || TIER_BG[1];
      g.addColorStop(0, c.top);
      g.addColorStop(1, c.bottom);
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBackground() {
    if (bgTransition.progress >= 1.0) {
      renderSingleBackground(bgTransition.toTier);
    } else {
      renderSingleBackground(bgTransition.fromTier);
      var p = bgTransition.progress;
      var alpha = p * p * (3 - 2 * p); // smoothstep ease-in-out
      ctx.save();
      ctx.globalAlpha = alpha;
      renderSingleBackground(bgTransition.toTier);
      ctx.restore();
    }
  }

  function drawGround() {
    var world = WORLDS[selectedCharId] || WORLDS.classic;
    var wImgs = worldImages[selectedCharId] || worldImages.classic;
    var activeTier = (bgTransition.progress >= 0.5) ? bgTransition.toTier : bgTransition.fromTier;
    var img = wImgs && wImgs.grounds ? wImgs.grounds[activeTier] : null;
    var gH = H - groundY;
    if (img && img.complete && img.naturalWidth > 0) {
      var tileW = (img.naturalWidth / img.naturalHeight) * gH;
      if (tileW <= 0) tileW = 1024 * (gH / 320);
      var startX = -(groundScrollX % tileW);
      for (var x = startX; x < W + tileW; x += tileW) {
        ctx.drawImage(img, x, groundY, tileW, gH);
      }
      return;
    }
    ctx.fillStyle = activeTier === 0 ? getVar("--ground") : (TIER_BG[activeTier] ? TIER_BG[activeTier].ground : "#2d2350");
    ctx.fillRect(0, groundY, W, gH);
  }

  function drawObstacles() {
    var world = WORLDS[selectedCharId] || WORLDS.classic;
    var obsImgs = obstacleImages[selectedCharId] || obstacleImages.classic;

    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      var isAir = o.kind === "birdlow" || o.kind === "birdhigh";
      var bob = isAir ? Math.sin(gameTime * 6 + o.phase) * 4 : 0;
      var oy = o.y + bob;

      // Tematik engel görseli varsa çiz
      var themedImg = null;
      if (obsImgs) {
        if (o.kind === "cactus") themedImg = obsImgs.bitki;
        else if (o.kind === "rock") themedImg = obsImgs.kaya;
        else if (o.kind === "spiketall") themedImg = obsImgs.diken;
        else if (isAir) themedImg = obsImgs.ucan;
      }

      if (themedImg && themedImg.complete && themedImg.naturalWidth > 0) {
        ctx.drawImage(themedImg, o.x, oy, o.w, o.h);
        continue;
      }

      ctx.fillStyle = isAir ? world.obstacleAir : world.obstacle;

      if (o.kind === "spiketall") {
        roundRect(o.x, oy + 10, o.w, o.h - 10, 4);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(o.x, oy + 10);
        ctx.lineTo(o.x + o.w / 2, oy - 6);
        ctx.lineTo(o.x + o.w, oy + 10);
        ctx.closePath();
        ctx.fill();
      } else if (o.kind === "cactus") {
        roundRect(o.x, oy, o.w, o.h, 5);
        ctx.fill();
        ctx.fillRect(o.x - 6, oy + o.h * 0.25, 7, 6);
        ctx.fillRect(o.x + o.w - 1, oy + o.h * 0.45, 7, 6);
      } else if (isAir) {
        if (birdSpriteImg.complete && birdSpriteImg.naturalWidth > 0) {
          ctx.drawImage(birdSpriteImg, o.x, oy, o.w, o.h);
        } else {
          // Outstretched wings with gold highlights
          ctx.fillStyle = "#ffd166";
          ctx.beginPath();
          ctx.moveTo(o.x + o.w * 0.35, oy + 8);
          ctx.lineTo(o.x - 2, oy - 10);
          ctx.lineTo(o.x + o.w * 0.55, oy + 4);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(o.x + o.w * 0.45, oy + 4);
          ctx.lineTo(o.x + o.w + 4, oy - 10);
          ctx.lineTo(o.x + o.w * 0.70, oy + 8);
          ctx.closePath();
          ctx.fill();

          // Main body in world's air obstacle color
          ctx.fillStyle = world.obstacleAir;
          roundRect(o.x + 8, oy + 2, o.w - 16, o.h - 4, 10);
          ctx.fill();

          // Golden sharp beak
          ctx.fillStyle = "#ffd166";
          ctx.beginPath();
          ctx.moveTo(o.x + 8, oy + o.h * 0.35);
          ctx.lineTo(o.x - 8, oy + o.h * 0.52);
          ctx.lineTo(o.x + 8, oy + o.h * 0.68);
          ctx.closePath();
          ctx.fill();

          // Glowing cyan eye
          ctx.fillStyle = "#4cc9f0";
          ctx.beginPath();
          ctx.arc(o.x + 15, oy + o.h * 0.46, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(o.x + 14, oy + o.h * 0.44, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        roundRect(o.x, oy, o.w, o.h, 8);
        ctx.fill();
      }
    }
  }

  var PU_COLORS = { shield: "--shield", slow: "--slow", multi: "--multi" };
  var PU_LABELS = { shield: "S", slow: "T", multi: "2X" };
  function drawPowerups() {
    for (var i = 0; i < powerups.length; i++) {
      var p = powerups[i];
      var by = p.y + Math.sin(gameTime * 4 + p.phase) * 5;
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, by, p.r, 0, Math.PI * 2);
      ctx.fillStyle = getVar(PU_COLORS[p.kind]);
      ctx.shadowColor = getVar(PU_COLORS[p.kind]);
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#07263a";
      ctx.font = "bold 12px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(PU_LABELS[p.kind], p.x, by + 1);
    }
  }

  function drawPlayer() {
    var squashAmt = Math.max(0, player.squash);
    var w = player.w * (1 + squashAmt * 0.18);
    var h = player.h * (1 - squashAmt * 0.18);
    var x = player.x - (w - player.w) / 2;
    var y = player.y + (player.h - h);
    var charInfo = getCharacter();
    var world = WORLDS[selectedCharId] || WORLDS.classic;
    var charKey = world.key;
    var oImgs = outfitImages[selectedCharId] || outfitImages.classic;

    var isPelerinEquipped = isOutfitEquipped(charKey, "pelerin");
    var isGozlukEquipped = isOutfitEquipped(charKey, "gunes_gozlugu");
    var isAksesuarEquipped = isOutfitEquipped(charKey, "ozel_aksesuar");
    var isSapkaEquipped = isOutfitEquipped(charKey, "parti_sapkasi");

    // 1. Pelerin (Cape - Karakterin Arkasında)
    if (isPelerinEquipped && oImgs && oImgs.pelerin && oImgs.pelerin.complete && oImgs.pelerin.naturalWidth > 0) {
      ctx.drawImage(oImgs.pelerin, x, y, w, h);
    }

    ctx.save();
    if (player.shielded) {
      ctx.beginPath();
      ctx.arc(x + w / 2, y + h / 2, Math.max(w, h) * 0.75, 0, Math.PI * 2);
      ctx.strokeStyle = getVar("--shield");
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    ctx.shadowColor = charInfo.glow;
    ctx.shadowBlur = 14;
    ctx.fillStyle = charInfo.body;
    roundRect(x, y, w, h, 8);
    ctx.fill();
    ctx.restore();

    // simple face
    ctx.fillStyle = "#1a1a2e";
    ctx.beginPath();
    ctx.arc(x + w * 0.62, y + h * 0.38, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.82, y + h * 0.38, 2.4, 0, Math.PI * 2);
    ctx.fill();

    // 2. Aksesuarlar (Gözlük, Özel Aksesuar, Parti Şapkası - Karakterin Üstünde)
    if (oImgs) {
      if (isGozlukEquipped && oImgs.gozluk && oImgs.gozluk.complete && oImgs.gozluk.naturalWidth > 0) {
        ctx.drawImage(oImgs.gozluk, x, y, w, h);
      }
      if (isAksesuarEquipped && oImgs.aksesuar && oImgs.aksesuar.complete && oImgs.aksesuar.naturalWidth > 0) {
        ctx.drawImage(oImgs.aksesuar, x, y, w, h);
      }
      if (isSapkaEquipped && oImgs.sapka && oImgs.sapka.complete && oImgs.sapka.naturalWidth > 0) {
        ctx.drawImage(oImgs.sapka, x, y, w, h);
      }
    }
  }

  function drawParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += gravity * dt * 0.6;
      ctx.globalAlpha = Math.max(0, p.life / 0.4);
      ctx.fillStyle = p.color || getVar("--ground");
      ctx.fillRect(p.x, p.y, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawComboPopup() {
    if (comboPopupTimer <= 0 || !comboPopupText) return;
    ctx.save();
    ctx.globalAlpha = Math.min(1, comboPopupTimer / 1.2);
    ctx.fillStyle = getVar("--multi");
    ctx.font = "bold 18px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(comboPopupText, W / 2, H * 0.22);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y + w, y, r);
    ctx.closePath();
  }

  var cssVarCache = {};
  function getVar(name) {
    if (!cssVarCache[name]) {
      cssVarCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    return cssVarCache[name];
  }
  window.addEventListener("resize", function () { cssVarCache = {}; });

  // ---- boot ----
  resize();
  bestLabel.textContent = "En iyi: " + Math.floor(best);
  buildCharGrid();
  document.getElementById("startBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    ensureAudio();
    resetGame();
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
